name: Verweise prüfen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verweise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Relative Verweise und Referenzen prüfen
        run: node tools/pruefe-verweise.mjs
